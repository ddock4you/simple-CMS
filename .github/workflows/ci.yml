name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 정적 분석 ──────────────────────────────────────────────────────────────────
  check-fsd:
    name: FSD 아키텍처 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FSD 아키텍처 검사
        run: node scripts/check-fsd.mjs

  # ── packages/* 직접 typecheck ─────────────────────────────────────────────────
  # admin/web typecheck로 transitively 검증되지만, packages만 변경하는 PR에서
  # turbo 캐시로 admin/web typecheck가 skip될 수 있어 직접 job으로 보장.
  packages-typecheck:
    name: packages / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run packages typecheck
        run: pnpm --filter "./packages/*" typecheck

  # ── 앱별 lint / typecheck / test / build ─────────────────────────────────────
  # test 태스크는 Vitest 2-track(unit jsdom + storybook Playwright Chromium)을 실행한다.
  # build 태스크는 Dockerfile/Vercel 빌드 회귀 PR 차단용. .next/cache로 인크리멘털 빌드 가속.
  test:
    name: ${{ matrix.app }} / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, web]
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # storybook play 테스트가 Playwright Chromium을 사용하므로 test 태스크에만 설치
      - name: Install Playwright browsers (storybook play 용)
        if: matrix.task == 'test'
        run: pnpm exec playwright install --with-deps chromium

      # Storybook addon-vitest cold start 가속용 캐시 (Stage 7k-3 보류 항목 — measure-first)
      # 효과 측정 후 keep/revert 결정. 캐시 hit 없으면 skip되므로 안전
      - name: Cache Storybook addon-vitest deps
        if: matrix.task == 'test'
        uses: actions/cache@v4
        with:
          path: |
            apps/${{ matrix.app }}/node_modules/.cache/storybook
            apps/${{ matrix.app }}/node_modules/.vite
          key: storybook-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml', 'apps/${{ matrix.app }}/.storybook/**') }}
          restore-keys: |
            storybook-${{ matrix.app }}-

      # build 태스크: Next.js incremental build 캐시
      - name: Cache .next/cache
        if: matrix.task == 'build'
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: next-cache-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/${{ matrix.app }}/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            next-cache-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-cache-${{ matrix.app }}-

      # build에서 prisma client 필요 (admin/web 모두 @simple-cms/db import)
      - name: Generate Prisma client
        if: matrix.task == 'build'
        run: pnpm --filter @simple-cms/db generate

      - name: Run ${{ matrix.task }}
        env:
          # build 시 schema 파싱 + Next.js 빌드용 placeholder. 실 값은 runtime 주입
          DATABASE_URL: ${{ matrix.task == 'build' && 'postgresql://placeholder:placeholder@placeholder:5432/placeholder' || '' }}
        run: pnpm --filter @simple-cms/${{ matrix.app }} ${{ matrix.task }}

  # ── E2E (Playwright) ──────────────────────────────────────────────────────────
  # Stage 8c부터 .github/workflows/e2e.yml로 이관됨.
  # nightly cron (UTC 17:00 = KST 02:00) + workflow_dispatch + main push 트리거.
