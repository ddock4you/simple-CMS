name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'E2E 테스트 실행 (postgres + 서버 필요)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 정적 분석 ──────────────────────────────────────────────────────────────────
  check-fsd:
    name: FSD 아키텍처 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FSD 아키텍처 검사
        run: node scripts/check-fsd.mjs

  # ── 앱별 lint / typecheck / test (unit + storybook) ──────────────────────────
  # test 태스크는 Vitest 2-track(unit jsdom + storybook Playwright Chromium)을 실행한다.
  test:
    name: ${{ matrix.app }} / ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, web]
        task: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # storybook play 테스트가 Playwright Chromium을 사용하므로 test 태스크에만 설치
      - name: Install Playwright browsers (storybook play 용)
        if: matrix.task == 'test'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ${{ matrix.task }}
        run: pnpm --filter @simple-cms/${{ matrix.app }} ${{ matrix.task }}

  # ── E2E (Playwright) — Stage 8 Docker + CI/CD 완료 후 자동 활성화 예정 ─────────
  #
  # 현재 실행 조건:
  #   - workflow_dispatch 로 수동 트리거 시 run_e2e=true 로 설정
  #   - 또는 저장소 Variables에 CI_E2E=true 설정 (로컬 self-hosted runner 등)
  #
  # 필요 환경:
  #   - PostgreSQL (groonga/pgroonga 이미지)
  #   - pnpm db:generate + db:push + db:seed + db:pgroonga
  #   - admin(3001) + web(3000) 빌드 & 기동
  #   - GitHub Secrets: DATABASE_URL, INITIAL_ADMIN_USERNAME, INITIAL_ADMIN_PASSWORD,
  #     FEEDBACK_IP_SALT, NEXTAUTH_SECRET (또는 각 앱 필수 env)
  e2e:
    name: E2E / Playwright
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e == true) ||
      vars.CI_E2E == 'true'
    services:
      postgres:
        image: groonga/pgroonga:latest-alpine-16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simple_cms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simple_cms_e2e
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FEEDBACK_IP_SALT: ci-test-salt
      INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME || 'admin' }}
      INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD || 'changeme123' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup database
        run: |
          pnpm db:generate
          pnpm db:push
          pnpm db:pgroonga
          pnpm db:seed

      - name: Build admin
        run: pnpm --filter @simple-cms/admin build

      - name: Build web
        run: pnpm --filter @simple-cms/web build

      - name: Start admin server
        run: pnpm --filter @simple-cms/admin start &

      - name: Start web server
        run: pnpm --filter @simple-cms/web start &

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:3001/login http://localhost:3000 \
            --timeout 60000 --interval 2000

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
